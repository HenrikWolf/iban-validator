spring:
  application:
    name: iban-validator
  jackson:
    default-property-inclusion: non_null
  # DigitalOcean managed database. Locally via the public host (your IP must be a trusted source),
  # in the cluster via the private VPC host (DB_HOST is set in backend/k8s/deployment.yaml).
  datasource:
    url: jdbc:postgresql://${DB_HOST:db-pgsql-fra1-05477-do-user-45507256-0.f.db.ondigitalocean.com}:25060/iban_validator?sslmode=require
    username: iban_validator
    password: ${DB_PASSWORD}

# External IBAN validation (https://ibanapi.com).
ibanapi:
  base-url: https://api.ibanapi.com/v1
  api-key: ${IBANAPI_KEY}

# IBANs are personal data: stored encrypted (AES-256-GCM) and deleted after the retention period.
iban:
  # Secret key (e.g. `openssl rand -base64 32`); the AES key is derived from it and the salt, the blind index uses it directly.
  encryption-key: ${IBAN_ENCRYPTION_KEY}
  # Hex-encoded salt for the key derivation. Not secret, but changing it makes stored IBANs unreadable.
  encryption-salt: 66eeafa80f6c896ab6146bff901cd0a7
  # How long a stored IBAN is kept before the cleanup job deletes it.
  retention: ${IBAN_RETENTION:30d}
  # Schedule of the cleanup job (Spring cron: sec min hour day month weekday); default daily at 03:00.
  cleanup-cron: ${IBAN_CLEANUP_CRON:0 0 3 * * *}

management:
  endpoint:
    health:
      probes:
        enabled: true
