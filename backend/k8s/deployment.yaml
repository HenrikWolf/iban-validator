apiVersion: apps/v1
kind: Deployment
metadata:
  name: iban-validator-backend
  namespace: iban-validator
spec:
  replicas: 1
  selector:
    matchLabels:
      app: iban-validator-backend
  template:
    metadata:
      labels:
        app: iban-validator-backend
    spec:
      imagePullSecrets:
        - name: registry-iban-validator-registry
      securityContext:
        runAsNonRoot: true
      containers:
        - name: backend
          # The deploy workflow replaces the tag with the commit SHA.
          image: registry.digitalocean.com/iban-validator-registry/iban-validator-backend:latest
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: DB_HOST
              value: private-db-pgsql-fra1-05477-do-user-45507256-0.f.db.ondigitalocean.com
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: iban-validator-db
                  key: password
            - name: IBANAPI_KEY
              valueFrom:
                secretKeyRef:
                  name: iban-validator-ibanapi
                  key: api-key
            - name: IBAN_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: iban-validator-encryption
                  key: key
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 512Mi
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 5
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
