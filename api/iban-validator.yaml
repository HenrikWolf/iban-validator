openapi: 3.0.3
info:
  title: IBAN Validator API
  description: Validates International Bank Account Numbers (IBAN) according to ISO 13616.
  version: 1.0.0
servers:
  - url: /api/v1
tags:
  - name: Iban
    description: IBAN validation
paths:
  /iban/validation:
    post:
      tags:
        - Iban
      operationId: validateIban
      summary: Validate an IBAN
      description: |
        Validates the given IBAN with the selected validator (default `IBANAPI`).
        Separators (spaces, hyphens, dots) are removed and letters are upper-cased before validation.
        An invalid IBAN is not an error: the response is `200` with `valid = false` and a `failureMessage`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IbanValidationRequest'
      responses:
        '200':
          description: Validation result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IbanValidationResponse'
        '400':
          description: Malformed request (e.g. missing or empty `iban`)
        '503':
          description: The selected validator is currently unavailable (e.g. the external service does not respond)
components:
  schemas:
    IbanValidationRequest:
      type: object
      required:
        - iban
      properties:
        iban:
          type: string
          minLength: 1
          maxLength: 64
          example: DE89 3704 0044 0532 0130 00
        validator:
          $ref: '#/components/schemas/IbanValidatorType'
    IbanValidatorType:
      type: string
      description: |
        Validator to use:
        `IBANAPI` asks the external service ibanapi.com,
        `INTERNAL` checks country code, country specific length and mod-97 check digits locally.
      enum:
        - IBANAPI
        - INTERNAL
      default: IBANAPI
    IbanValidationResponse:
      type: object
      required:
        - iban
        - valid
      properties:
        iban:
          type: string
          description: Normalized IBAN (separators removed, upper case)
          example: DE89370400440532013000
        valid:
          type: boolean
          example: true
        countryCode:
          type: string
          description: ISO 3166-1 alpha-2 country code, if the IBAN is valid
          example: DE
        failureMessage:
          type: string
          description: Human-readable reason why the IBAN is invalid (wording depends on the validator). Absent if the IBAN is valid.
          example: Invalid IBAN Checksum
