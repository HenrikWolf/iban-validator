# Public entry point (HTTP only, no authentication): the load balancer points to the frontend,
# whose nginx forwards /api to the internal backend service.
# The name still says "backend" so that the existing load balancer and its IP are kept.
apiVersion: v1
kind: Service
metadata:
  name: iban-validator-backend-public
  namespace: iban-validator
  annotations:
    service.beta.kubernetes.io/do-loadbalancer-name: iban-validator
spec:
  type: LoadBalancer
  selector:
    app: iban-validator-frontend
  ports:
    - name: http
      port: 80
      targetPort: http
