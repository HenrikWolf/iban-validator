# Public entry point via Traefik: HTTPS with a Let's Encrypt certificate, plain HTTP is redirected to HTTPS.
# /api goes to the backend, everything else to the frontend.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: iban-validator
  namespace: iban-validator
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - iban-validator.henrikwolf.de
      secretName: iban-validator-tls
  rules:
    - host: iban-validator.henrikwolf.de
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: iban-validator-backend
                port:
                  name: http
          - path: /
            pathType: Prefix
            backend:
              service:
                name: iban-validator-frontend
                port:
                  name: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: iban-validator-http
  namespace: iban-validator
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
    traefik.ingress.kubernetes.io/router.middlewares: iban-validator-redirect-https@kubernetescrd
spec:
  ingressClassName: traefik
  rules:
    - host: iban-validator.henrikwolf.de
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: iban-validator-frontend
                port:
                  name: http
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: redirect-https
  namespace: iban-validator
spec:
  redirectScheme:
    scheme: https
    permanent: true
