name: Backend

on:
  workflow_dispatch:

env:
  IMAGE: registry.digitalocean.com/iban-validator-registry/iban-validator-backend
  CLUSTER: k8s-1-36-3-do-5-fra1-1790953586443
  NAMESPACE: iban-validator

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Build and test
        run: ./mvnw --batch-mode --no-transfer-progress verify

      - name: Install doctl
        uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}

      - name: Build and push image
        run: |
          doctl registry login --expiry-seconds 600
          docker build -t "$IMAGE:$GITHUB_SHA" .
          docker push "$IMAGE:$GITHUB_SHA"

      - name: Configure kubectl
        run: doctl kubernetes cluster kubeconfig save --expiry-seconds 600 "$CLUSTER"

      - name: Deploy
        env:
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        run: |
          kubectl create namespace "$NAMESPACE" --dry-run=client -o yaml | kubectl apply -f -
          doctl registry kubernetes-manifest --namespace "$NAMESPACE" | kubectl apply -f -
          kubectl -n "$NAMESPACE" create secret generic iban-validator-db --from-literal=password="$DB_PASSWORD" --dry-run=client -o yaml | kubectl apply -f -
          sed -i "s|$IMAGE:latest|$IMAGE:$GITHUB_SHA|" k8s/deployment.yaml
          kubectl apply -f k8s/
          kubectl -n "$NAMESPACE" rollout status deployment/iban-validator-backend --timeout=180s
