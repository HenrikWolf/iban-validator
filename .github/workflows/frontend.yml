name: Frontend

on:
  workflow_dispatch:

env:
  IMAGE: registry.digitalocean.com/iban-validator-registry/iban-validator-frontend
  CLUSTER: k8s-1-36-3-do-5-fra1-1790953586443
  NAMESPACE: iban-validator

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Install doctl
        uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}

      - name: Build and push image
        run: |
          doctl registry login --expiry-seconds 600
          docker build -t "$IMAGE:$GITHUB_SHA" .
          docker push "$IMAGE:$GITHUB_SHA"

      - name: Configure kubectl
        run: doctl kubernetes cluster kubeconfig save --expiry-seconds 600 "$CLUSTER"

      - name: Deploy
        run: |
          kubectl create namespace "$NAMESPACE" --dry-run=client -o yaml | kubectl apply -f -
          doctl registry kubernetes-manifest --namespace "$NAMESPACE" | kubectl apply -f -
          sed -i "s|$IMAGE:latest|$IMAGE:$GITHUB_SHA|" k8s/deployment.yaml
          kubectl apply -f k8s/
          kubectl -n "$NAMESPACE" rollout status deployment/iban-validator-frontend --timeout=180s
